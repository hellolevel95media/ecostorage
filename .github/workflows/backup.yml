name: Database backup

on:
  schedule:
    # 03:00 UTC daily
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client matching the Supabase server version
        # Ubuntu's default apt repo ships whatever postgresql-client happens
        # to be current for that Ubuntu release (currently 16), which drifts
        # behind Supabase's Postgres version over time — pg_dump refuses to
        # dump a server newer than itself ("server version mismatch"). The
        # official PostgreSQL apt repo (PGDG) always has the current major
        # version, so install from there instead of pinning a number here.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
      - name: Run backup
        env:
          NEXT_PUBLIC_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: bash scripts/backup-db.sh
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backups/*.sql.gz
          retention-days: 30
